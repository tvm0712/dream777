<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doraemon World Slots</title>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body { font-family: 'Fredoka', sans-serif; }
        .perspective-1000 { perspective: 1000px; }
    </style>
</head>
<body class="bg-[#1a4c8a] text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- 圖標組件 (Inline SVGs) ---
        const Volume2Icon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        );
        const VolumeXIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        );
        const PlayIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        );

        // --- 哆啦A夢主題符號定義 ---
        // logic: localImg 為優先，fallbackImg 為備援
        const SYMBOLS = [
            { id: 'door', name: '任意門', localImg: '001.webp', fallbackImg: 'https://cdn-icons-png.flaticon.com/512/12003/12003669.png', value: 100, weight: 1 }, 
            { id: 'bell', name: '鈴鐺', localImg: '002.webp', fallbackImg: 'https://cdn-icons-png.flaticon.com/512/3655/3655584.png', value: 50, weight: 2 },
            { id: 'dorayaki', name: '銅鑼燒', localImg: '003.webp', fallbackImg: 'https://cdn-icons-png.flaticon.com/512/3014/3014526.png', value: 20, weight: 3 },
            { id: 'copter', name: '竹蜻蜓', localImg: '004.webp', fallbackImg: 'https://cdn-icons-png.flaticon.com/512/10609/10609653.png', value: 15, weight: 4 },
            { id: 'bread', name: '記憶吐司', localImg: '005.webp', fallbackImg: 'https://cdn-icons-png.flaticon.com/512/3246/3246724.png', value: 10, weight: 5 },
            { id: 'time', name: '時光機', localImg: '006.webp', fallbackImg: 'https://cdn-icons-png.flaticon.com/512/2092/2092572.png', value: 5, weight: 6 },
            { id: 'glasses', name: '眼鏡', localImg: '007.webp', fallbackImg: 'https://cdn-icons-png.flaticon.com/512/640/640167.png', value: 2, weight: 7 },
        ];

        // 擴展符號池
        const POOL = [];
        SYMBOLS.forEach(sym => {
            for (let i = 0; i < sym.weight * 3; i++) {
                POOL.push(sym);
            }
        });

        const getRandomSymbol = () => POOL[Math.floor(Math.random() * POOL.length)];

        const generateGrid = () => [
            [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()],
            [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()],
            [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()]
        ];

        // --- Web Audio API 音效引擎 ---
        const synthSound = (type, ctx) => {
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            const now = ctx.currentTime;

            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(2000, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'spin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.1);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'stop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50]; 
                notes.forEach((freq, i) => {
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.connect(g);
                    g.connect(ctx.destination);
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.2, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.3);
                });
            } else if (type === 'bigWin') {
                for(let i=0; i<15; i++) {
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.connect(g);
                    g.connect(ctx.destination);
                    o.type = i % 2 === 0 ? 'sine' : 'square';
                    o.frequency.setValueAtTime(400 + i*80, now + i*0.06);
                    g.gain.setValueAtTime(0.2, now + i*0.06);
                    g.gain.linearRampToValueAtTime(0.01, now + i*0.06 + 0.1);
                    o.start(now + i*0.06);
                    o.stop(now + i*0.06 + 0.1);
                }
            } else if (type === 'start') {
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(261.63, now); 
                osc.frequency.linearRampToValueAtTime(523.25, now + 0.3); 
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.1);
                gainNode.gain.linearRampToValueAtTime(0, now + 1.0);
                osc.start(now);
                osc.stop(now + 1.0);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.5);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        };

        // --- 音符頻率表 (C3 - C6) ---
        const N = {
            Bb3: 233.08, // 補上缺少的音符
            C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, Bb4: 466.16, B4: 493.88,
            C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, Bb5: 932.33, B5: 987.77,
            C6: 1046.50, D6: 1174.66
        };

        // --- 哆啦A夢旋律 ---
        const DORAEMON_MELODY = [
            // Verse
            { n: N.F4, d: 0.5 }, { n: N.F4, d: 0.5 }, { n: N.A4, d: 0.5 }, { n: N.A4, d: 0.5 }, 
            { n: N.Bb4, d: 0.5 }, { n: N.Bb4, d: 0.5 }, { n: N.Bb4, d: 0.5 }, { n: N.D5, d: 0.5 },
            // Dekitara iina
            { n: N.C5, d: 0.5 }, { n: N.C5, d: 0.5 }, { n: N.C5, d: 0.5 }, { n: N.Bb4, d: 0.5 },
            { n: N.A4, d: 0.5 }, { n: N.G4, d: 0.5 }, { n: N.F4, d: 1.0 },
            { n: 0, d: 0.5 },
            // Minna minna minna
            { n: N.G4, d: 0.5 }, { n: N.G4, d: 0.5 }, { n: N.A4, d: 0.5 }, { n: N.G4, d: 0.5 },
            { n: N.F4, d: 0.5 }, { n: N.E4, d: 0.5 }, { n: N.D4, d: 1.0 },
            { n: 0, d: 0.5 },
            // An an an
            { n: N.F4, d: 0.5 }, { n: N.D4, d: 0.5 }, { n: 0, d: 0.25 }, { n: N.Bb3, d: 0.25 }, 
            { n: N.F4, d: 0.5 }, { n: N.D4, d: 0.5 }, { n: N.Bb4, d: 1.0 },
            // Tottemo daisuki
            { n: N.G4, d: 0.5 }, { n: N.G4, d: 0.5 }, { n: N.A4, d: 0.5 }, { n: N.G4, d: 0.5 },
            { n: N.F4, d: 0.5 }, { n: N.E4, d: 0.5 }, 
            // Doraemon
            { n: N.D4, d: 0.5 }, { n: N.E4, d: 0.5 }, { n: N.F4, d: 1.5 },
            { n: 0, d: 1.0 },
        ];

        // --- 水晶音樂播放器 ---
        const playCrystalNote = (ctx, freq, startTime, duration) => {
            // 修正：檢查頻率是否為有效的數字
            if (!Number.isFinite(freq) || freq === 0) return; 

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.value = freq * 2; 

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);

            const attackTime = 0.01;
            const decayTime = duration * 1.5;

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.2, startTime + attackTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + decayTime); 

            gain2.gain.setValueAtTime(0, startTime);
            gain2.gain.linearRampToValueAtTime(0.1, startTime + attackTime); 
            gain2.gain.exponentialRampToValueAtTime(0.001, startTime + decayTime * 0.8); 

            osc.start(startTime);
            osc.stop(startTime + decayTime);
            osc2.start(startTime);
            osc2.stop(startTime + decayTime);
        };

        // --- 圖片組件 (包含自動 Fallback 邏輯) ---
        const SlotImage = ({ symbol, className, isWinning }) => {
            const handleImageError = (e) => {
                // 如果目前是 localImg 讀取失敗，就切換到 fallbackImg
                if (e.target.src.includes(symbol.localImg)) {
                    e.target.onerror = null; // 防止無限循環
                    e.target.src = symbol.fallbackImg;
                }
            };

            return (
                <img 
                    src={symbol.localImg} 
                    alt={symbol.name}
                    title={symbol.name}
                    onError={handleImageError}
                    className={`${className} ${isWinning ? 'scale-110 animate-[bounce_1s_infinite]' : ''}`}
                />
            );
        };

        function SlotMachineApp() {
            const [hasStarted, setHasStarted] = useState(false);
            const [balance, setBalance] = useState(1000);
            const [bet, setBet] = useState(10);
            const [grid, setGrid] = useState(generateGrid());
            const [isSpinning, setIsSpinning] = useState(false);
            const [winData, setWinData] = useState({ amount: 0, lines: [], type: '' });
            const [autoPlay, setAutoPlay] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            
            const audioCtxRef = useRef(null);
            const bgmTimeoutRef = useRef(null);
            const noteIndexRef = useRef(0);

            useEffect(() => {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtxRef.current = new AudioContext();
                return () => {
                    if (audioCtxRef.current) audioCtxRef.current.close();
                    if (bgmTimeoutRef.current) clearTimeout(bgmTimeoutRef.current);
                };
            }, []);

            // --- BGM 循環 ---
            const scheduleBGM = useCallback(() => {
                if (isMuted || !hasStarted || !audioCtxRef.current) return;

                const ctx = audioCtxRef.current;
                const tempo = 0.3; 

                const noteData = DORAEMON_MELODY[noteIndexRef.current];
                
                playCrystalNote(ctx, noteData.n, ctx.currentTime, noteData.d * tempo * 1.5); 

                noteIndexRef.current = (noteIndexRef.current + 1) % DORAEMON_MELODY.length;

                const nextNoteTime = noteData.d * tempo * 1000;
                bgmTimeoutRef.current = setTimeout(scheduleBGM, nextNoteTime);
            }, [hasStarted, isMuted]);

            useEffect(() => {
                if (hasStarted && !isMuted) {
                    if (audioCtxRef.current?.state === 'suspended') {
                        audioCtxRef.current.resume();
                    }
                    if (!bgmTimeoutRef.current) {
                        scheduleBGM();
                    }
                } else {
                    if (bgmTimeoutRef.current) {
                        clearTimeout(bgmTimeoutRef.current);
                        bgmTimeoutRef.current = null;
                    }
                }
            }, [hasStarted, isMuted, scheduleBGM]);

            const playSound = useCallback((type) => {
                if (isMuted || !audioCtxRef.current) return;
                if (audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume();
                }
                synthSound(type, audioCtxRef.current);
            }, [isMuted]);

            const handleStartGame = () => {
                if (audioCtxRef.current) {
                    audioCtxRef.current.resume().then(() => {
                        setHasStarted(true);
                        setIsMuted(false);
                        playSound('start');
                    });
                } else {
                    setHasStarted(true);
                }
            };

            const checkWin = useCallback((currentGrid) => {
                let totalWin = 0;
                let winningLines = [];
                
                const lines = [
                    { name: 'Top', coords: [[0,0], [0,1], [0,2]] },
                    { name: 'Mid', coords: [[1,0], [1,1], [1,2]] },
                    { name: 'Bot', coords: [[2,0], [2,1], [2,2]] },
                    { name: 'Diag1', coords: [[0,0], [1,1], [2,2]] },
                    { name: 'Diag2', coords: [[2,0], [1,1], [0,2]] },
                ];

                lines.forEach(line => {
                    const [a, b, c] = line.coords;
                    const s1 = currentGrid[a[0]][a[1]];
                    const s2 = currentGrid[b[0]][b[1]];
                    const s3 = currentGrid[c[0]][c[1]];

                    if (s1.id === s2.id && s2.id === s3.id) {
                        totalWin += s1.value * bet;
                        winningLines.push(line.name);
                    }
                });

                if (totalWin > 0) {
                    setBalance(prev => prev + totalWin);
                    
                    let type = 'WIN';
                    let soundType = 'win';

                    if (totalWin >= bet * 50) {
                        type = 'MEGA WIN';
                        soundType = 'bigWin';
                    } else if (totalWin >= bet * 10) {
                        type = 'BIG WIN';
                        soundType = 'bigWin';
                    }

                    setWinData({ amount: totalWin, lines: winningLines, type });
                    playSound(soundType);

                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate([100, 50, 100, 50, 200]);
                    }
                } else {
                    setWinData({ amount: 0, lines: [], type: '' });
                }
            }, [bet, playSound]);

            const spin = useCallback(() => {
                if (balance < bet) {
                    playSound('gameover');
                    setAutoPlay(false);
                    return;
                }

                setIsSpinning(true);
                setWinData({ amount: 0, lines: [], type: '' });
                setBalance(prev => prev - bet);
                playSound('coin');

                let spins = 0;
                const maxSpins = 20;
                const intervalTime = 100;

                const interval = setInterval(() => {
                    setGrid([
                        [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()],
                        [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()],
                        [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()]
                    ]);
                    playSound('spin');
                    spins++;

                    if (spins >= maxSpins) {
                        clearInterval(interval);
                        const finalGrid = generateGrid();
                        setGrid(finalGrid);
                        setIsSpinning(false);
                        playSound('stop');
                        checkWin(finalGrid);
                    }
                }, intervalTime);

            }, [balance, bet, checkWin, playSound]);

            useEffect(() => {
                let timer;
                if (autoPlay && !isSpinning && balance >= bet) {
                    timer = setTimeout(() => {
                        spin();
                    }, 1500);
                } else if (balance < bet) {
                    setAutoPlay(false);
                }
                return () => clearTimeout(timer);
            }, [autoPlay, isSpinning, balance, bet, spin]);

            const adjustBet = (amount) => {
                if (!isSpinning) {
                    const newBet = Math.max(10, Math.min(balance, bet + amount));
                    if (newBet <= 500) {
                        setBet(newBet);
                        playSound('coin');
                    }
                }
            };

            const handleRecharge = () => {
                setBalance(1000);
                playSound('bigWin');
            };

            return (
                <div className="min-h-screen bg-[#1a4c8a] text-white font-sans flex flex-col items-center justify-center p-4 overflow-hidden relative selection:bg-none">
                    
                    {/* 背景 */}
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-400 via-[#1a4c8a] to-[#0d2545] z-0 pointer-events-none"></div>
                    <div className="absolute top-10 left-10 w-32 h-32 bg-yellow-400 rounded-full blur-3xl opacity-20 animate-pulse"></div>
                    <div className="absolute bottom-10 right-10 w-40 h-40 bg-pink-500 rounded-full blur-3xl opacity-20 animate-pulse delay-700"></div>

                    {/* 音量控制 */}
                    {hasStarted && (
                        <button 
                            onClick={() => setIsMuted(!isMuted)}
                            className="absolute top-4 right-4 z-50 p-3 bg-black/30 hover:bg-black/50 rounded-full border border-white/20 transition-colors"
                            title={isMuted ? "開啟聲音" : "靜音"}
                        >
                            {isMuted ? <VolumeXIcon className="text-white/70" /> : <Volume2Icon className="text-yellow-300" />}
                        </button>
                    )}

                    {/* 標題 */}
                    <div className="z-10 text-center mb-6">
                        <h1 className="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-blue-200 to-white drop-shadow-[0_4px_0_#0d2545] stroke-black" style={{WebkitTextStroke: '1px #0d2545'}}>
                            DORAEMON WORLD
                        </h1>
                        <div className="flex items-center justify-center gap-2 mt-2">
                            <div className="h-1 w-8 bg-red-500 rounded-full"></div>
                            <p className="text-blue-200 text-sm tracking-widest font-bold">FUTURE GADGETS SLOTS</p>
                            <div className="h-1 w-8 bg-red-500 rounded-full"></div>
                        </div>
                    </div>

                    {/* 機台主體 */}
                    <div className="z-10 bg-gradient-to-b from-blue-600 to-blue-800 p-4 rounded-[2rem] border-8 border-white/90 shadow-[0_20px_60px_rgba(0,0,0,0.5)] w-full max-w-lg relative">
                        
                        <div className="absolute top-[18px] left-1/2 -translate-x-1/2 w-[90%] h-4 bg-red-600 rounded-full shadow-inner opacity-80"></div>
                        
                        <div className="absolute -top-6 left-1/2 -translate-x-1/2 w-16 h-16 bg-gradient-to-br from-yellow-300 to-yellow-600 rounded-full border-4 border-black shadow-lg flex items-center justify-center z-20">
                            <div className="w-12 h-1 bg-black/20 rounded-full mt-2"></div>
                            <div className="absolute w-3 h-3 bg-black rounded-full mb-[-10px]"></div>
                        </div>

                        {/* 資訊板 */}
                        <div className="bg-[#0d2545]/90 border-2 border-blue-400 rounded-2xl p-4 mb-4 flex justify-between items-center mt-8 shadow-inner">
                            <div className="flex flex-col">
                                <span className="text-[10px] text-blue-300 uppercase tracking-wider font-bold">POCKET MONEY</span>
                                <span className="text-2xl font-mono text-white font-black tracking-tight">${balance.toLocaleString()}</span>
                            </div>
                            <div className="flex flex-col items-end">
                                <span className="text-[10px] text-blue-300 uppercase tracking-wider font-bold">PRIZE</span>
                                <span className={`text-2xl font-mono font-black tracking-tight ${winData.amount > 0 ? 'text-yellow-400 animate-bounce' : 'text-gray-400'}`}>
                                    ${winData.amount}
                                </span>
                            </div>
                        </div>

                        {/* 轉輪區域 */}
                        <div className="relative bg-white border-4 border-blue-900/20 rounded-xl p-2 overflow-hidden shadow-[inset_0_2px_10px_rgba(0,0,0,0.1)] mb-6">
                            <div className="grid grid-cols-3 gap-2">
                                {[0, 1, 2].map((colIndex) => (
                                    <div key={colIndex} className="flex flex-col gap-2">
                                        {[0, 1, 2].map((rowIndex) => {
                                            const symbol = grid[rowIndex][colIndex];
                                            const isWinningLine = winData.amount > 0 && !isSpinning;
                                            
                                            return (
                                                <div 
                                                    key={`${colIndex}-${rowIndex}`}
                                                    className={`
                                                        h-24 md:h-28 rounded-xl flex items-center justify-center bg-blue-50 border-2 border-blue-100 relative
                                                        ${isSpinning ? 'blur-[1px] translate-y-2 opacity-80 transition-all duration-75' : 'transition-all duration-300'}
                                                        ${isWinningLine ? 'bg-yellow-50 border-yellow-300 scale-105 shadow-md z-10' : ''}
                                                    `}
                                                >
                                                    <SlotImage 
                                                        symbol={symbol} 
                                                        className="w-16 h-16 md:w-20 md:h-20 object-contain drop-shadow-sm transition-transform duration-200"
                                                        isWinning={isWinningLine}
                                                    />
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>

                            {/* 中獎特效 */}
                            {winData.amount > 0 && (
                                <div className="absolute inset-0 flex items-center justify-center z-20 bg-black/30 backdrop-blur-[1px] animate-in fade-in duration-200 rounded-xl">
                                    <div className="text-center transform scale-110">
                                        <h2 className="text-4xl md:text-5xl font-black text-yellow-400 drop-shadow-[0_4px_0_rgba(0,0,0,0.5)] stroke-white tracking-wider animate-pulse">
                                            {winData.type}!
                                        </h2>
                                        <div className="bg-red-600 text-white px-4 py-1 rounded-full text-xl font-bold mt-2 shadow-lg rotate-[-2deg] border-2 border-white inline-block">
                                            +${winData.amount}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* 操作面板 */}
                        <div className="bg-white/10 rounded-2xl p-3 border border-white/20 backdrop-blur-sm">
                            <div className="flex justify-between items-center mb-3 px-1">
                                <div className="flex items-center gap-2 bg-black/20 px-3 py-1 rounded-full">
                                    <span className="text-[10px] text-blue-200 font-bold">BET</span>
                                    <span className="text-yellow-300 font-mono text-xl font-bold">{bet}</span>
                                </div>
                                <div className="flex gap-1">
                                    <button onClick={() => adjustBet(-10)} disabled={isSpinning} className="w-8 h-8 rounded-full bg-blue-500 border-b-2 border-blue-700 text-white font-bold hover:bg-blue-400 active:border-b-0 active:translate-y-[2px]">-</button>
                                    <button onClick={() => adjustBet(10)} disabled={isSpinning} className="w-8 h-8 rounded-full bg-blue-500 border-b-2 border-blue-700 text-white font-bold hover:bg-blue-400 active:border-b-0 active:translate-y-[2px]">+</button>
                                    <button onClick={() => !isSpinning && setBet(Math.min(balance, 100))} disabled={isSpinning} className="px-3 h-8 rounded-full bg-red-500 border-b-2 border-red-700 text-white text-[10px] font-bold hover:bg-red-400 active:border-b-0 active:translate-y-[2px]">MAX</button>
                                </div>
                            </div>

                            <div className="grid grid-cols-4 gap-2 h-14">
                                <button 
                                    onClick={() => { setAutoPlay(!autoPlay); playSound('coin'); }}
                                    className={`col-span-1 rounded-xl border-b-4 text-xs font-bold flex flex-col items-center justify-center active:border-b-0 active:translate-y-1 transition-all
                                        ${autoPlay 
                                        ? 'bg-green-500 border-green-700 text-white' 
                                        : 'bg-slate-200 border-slate-300 text-slate-500 hover:bg-white'
                                        }`}
                                >
                                    AUTO
                                </button>

                                <button 
                                    onClick={spin}
                                    disabled={isSpinning}
                                    className={`col-span-3 rounded-xl bg-gradient-to-b from-red-500 to-red-600 border-b-4 border-red-800 text-white text-2xl font-black tracking-widest shadow-lg active:border-b-0 active:translate-y-1 transition-all
                                    ${isSpinning ? 'brightness-90 cursor-wait' : 'hover:brightness-110 hover:-translate-y-[1px]'}
                                    `}
                                >
                                    {isSpinning ? '...' : 'GO!'}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 充值彈窗 */}
                    {balance < 10 && (
                        <div className="absolute inset-0 z-50 bg-black/80 flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-white p-6 rounded-3xl text-center animate-in zoom-in max-w-xs border-4 border-blue-500">
                                <h3 className="text-2xl font-black text-blue-600 mb-2">零用錢沒了!</h3>
                                <p className="text-gray-500 mb-6 text-sm">要找媽媽拿零用錢嗎？</p>
                                <button 
                                    onClick={handleRecharge}
                                    className="bg-blue-500 hover:bg-blue-400 text-white font-bold py-3 px-8 rounded-full shadow-lg w-full transition-transform hover:scale-105"
                                >
                                    拿 $1,000
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 啟動畫面 */}
                    {!hasStarted && (
                        <div className="absolute inset-0 z-[60] bg-[#1a4c8a] flex flex-col items-center justify-center p-4">
                            <div className="relative mb-8">
                                <div className="absolute inset-0 bg-yellow-400 blur-3xl opacity-20 animate-pulse rounded-full"></div>
                                <div className="w-32 h-32 bg-white rounded-full flex items-center justify-center border-8 border-blue-500 shadow-2xl relative z-10 animate-bounce">
                                    <PlayIcon className="w-16 h-16 text-blue-500 fill-blue-500 ml-2" />
                                </div>
                            </div>
                            
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-4 drop-shadow-md text-center">
                                DORAEMON WORLD
                            </h1>
                            <p className="text-blue-200 mb-8 text-center max-w-xs">
                                點擊下方按鈕開始遊戲<br/>並啟動音效引擎
                            </p>

                            <button 
                                onClick={handleStartGame}
                                className="bg-gradient-to-r from-yellow-400 to-orange-500 text-white text-xl font-black py-4 px-12 rounded-full shadow-[0_10px_20px_rgba(234,179,8,0.4)] hover:scale-105 transition-transform active:scale-95 border-4 border-white/30"
                            >
                                START GAME
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SlotMachineApp />);
    </script>
</body>
</html>
